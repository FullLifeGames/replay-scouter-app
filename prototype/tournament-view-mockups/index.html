<title>Tournament View Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE: throwaway mockups for the Tournament Teams view of the Replay Scouter. Not production code. -->
<style>
/* Layout: the app's own navbar, a strip that shows the shared filter state, then the variant;
   a high-contrast prototype switcher floats bottom-centre and is not part of any design. */
:root {
  --bg: #ffffff; --bg2: #f4f5fa; --bg3: #e9ebf5; --fg: #1b1e2c; --muted: #5d6480; --line: #dcdfeb;
  --accent: #3343c4; --accent-soft: #e6e8fb; --win: #17804a; --win-soft: #e2f3e9; --lose: #b8512a; --hl: #e3a008;
  --nav-a: rgb(24, 25, 79); --nav-b: hsl(230 25% 18%); --nav-c: rgb(10, 17, 30); --nav-fg: #e8eaf6;
  --bar-bg: #111111; --bar-fg: #fafafa;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12141c; --bg2: #191c27; --bg3: #232736; --fg: #e3e5ef; --muted: #9aa0ba; --line: #2b3042;
  --accent: #9aa5ff; --accent-soft: #232846; --win: #4cc283; --win-soft: #16301f; --lose: #f08a5d; --hl: #f2b632;
  --bar-bg: #fafafa; --bar-fg: #111111; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12141c; --bg2: #191c27; --bg3: #232736; --fg: #e3e5ef; --muted: #9aa0ba; --line: #2b3042;
  --accent: #9aa5ff; --accent-soft: #232846; --win: #4cc283; --win-soft: #16301f; --lose: #f08a5d; --hl: #f2b632;
  --bar-bg: #fafafa; --bar-fg: #111111; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 20px; } h3 { font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* app navbar (copied look of NavbarHeader.vue) */
.nav { background: linear-gradient(45deg, var(--nav-a) 0%, var(--nav-b) 72%, var(--nav-c) 100%); color: var(--nav-fg); }
.nav .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.nav .brand { font-size: 19px; font-weight: 500; }
.nav .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; }
.nav .links span { opacity: .55; } .nav .links span.on { opacity: 1; }

/* shared filter-state strip */
.state { background: var(--bg2); border-bottom: 1px solid var(--line); }
.state .wrap { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding-block: 8px; font-size: 12px; }
.state code { font-family: var(--mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; overflow-wrap: anywhere; }
.state .grow { flex: 1 1 260px; min-width: 0; }

main.wrap { padding-block: 18px 120px; }

/* generic bits */
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 8px 2px 4px; font-size: 12.5px; white-space: nowrap; }
.chip.text { padding-left: 8px; }
.chip.neg { border-color: var(--lose); color: var(--lose); text-decoration: line-through; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip button { border: 0; background: none; padding: 0 2px; color: var(--muted); line-height: 1; }
.chip .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 5px 10px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--bg); }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg3); color: var(--muted); white-space: nowrap; }
.pill.cat-Official { background: var(--accent-soft); color: var(--accent); }
.pill.cat-Team { background: var(--win-soft); color: var(--win); }
.pill.cat-Ladder { background: color-mix(in srgb, var(--hl) 18%, var(--bg)); color: color-mix(in srgb, var(--hl) 70%, var(--fg)); }
input.text, select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 9px; width: 100%; min-width: 0; }
.field { display: grid; gap: 5px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.note { background: var(--bg2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.scroll-x { overflow-x: auto; }

/* pokemon icons from the app's sprite sheet */
.pi { display: inline-block; width: 40px; height: 30px; image-rendering: pixelated; background: url(sprites/pokemonicons-sheet.png) no-repeat; flex: none; border-radius: 6px; }
.pi.hl { background-color: color-mix(in srgb, var(--hl) 30%, transparent); box-shadow: inset 0 0 0 2px var(--hl); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.condA { background: var(--hl); } .sw.condB { background: var(--accent); }
.pi.hlb { background-color: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
.pi.unknown { background: var(--bg3); position: relative; }
.pi.unknown::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.mirror .pi:not(.unknown) { transform: scaleX(-1); }
.team { display: inline-flex; flex-wrap: nowrap; }

/* match rows */
.mlist { display: grid; gap: 8px; }
.match { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.match.open { border-color: var(--accent); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 9px 12px; cursor: pointer; }
.mrow:hover { background: var(--bg2); border-radius: 10px; }
.side { display: grid; gap: 2px; min-width: 0; }
.side.r { justify-items: end; text-align: right; }
.who { font-size: 13px; overflow-wrap: anywhere; }
.who b.win { color: var(--win); }
.who .as { color: var(--muted); font-size: 12px; }
.score { font-size: 18px; font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.score .w { color: var(--win); } .score .l { color: var(--muted); }
.score i { font-style: normal; color: var(--muted); font-weight: 400; }
.mmeta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.games { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 12px; background: var(--bg2); border-radius: 0 0 10px 10px; }
.game.off { opacity: .55; }
.game h4 { margin: 0 0 6px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.gsides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sets { display: grid; gap: 4px; font-size: 12.5px; }
.set { display: grid; grid-template-columns: 40px 1fr; gap: 6px; align-items: center; }
.set .mv { color: var(--muted); }
.more { font-size: 12px; color: var(--muted); }
.flag { color: var(--lose); font-weight: 600; }
@media (max-width: 720px) {
  .mrow { grid-template-columns: minmax(0, 1fr) auto; }
  .side.r { justify-items: start; text-align: left; grid-row: 2; }
  .score { grid-row: 1 / 3; grid-column: 2; flex-direction: column; align-items: center; gap: 0; }
  .score i { display: none; }
  .mirror .pi:not(.unknown) { transform: none; }
  .gsides { grid-template-columns: 1fr; }
}

/* layout A */
.va { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.filters { display: grid; gap: 14px; position: sticky; top: 12px; }
.filters details > summary { display: none; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
@media (max-width: 900px) {
  .va { grid-template-columns: 1fr; }
  .filters { position: static; }
  .filters details > summary { display: block; cursor: pointer; font-weight: 600; padding: 8px 0; }
}

/* suggest dropdown */
.suggest { position: relative; }
.sugg { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .16); max-height: 320px; overflow: auto; }
.sugg button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 9px; text-align: left; }
.sugg button:hover, .sugg button.act { background: var(--accent-soft); }
.sugg .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
.sugg .grp { padding: 6px 9px 2px; }

/* stats tables */
table.st { border-collapse: collapse; width: 100%; font-size: 13px; }
table.st th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.st td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.st td.num { text-align: right; white-space: nowrap; }
table.st tr.detail td { background: var(--bg2); }
.bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.wr.good { color: var(--win); font-weight: 600; } .wr.bad { color: var(--lose); }
.monname { border: 0; background: none; padding: 0; color: var(--fg); text-align: left; }
.monname:hover { color: var(--accent); text-decoration: underline; }
.detailgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 6px 0; }
.kv { display: grid; gap: 2px; font-size: 12.5px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; }

/* B */
.tlist { display: grid; }
@media (max-width: 600px) { .bfilters { grid-template-columns: 1fr !important; } }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px 90px 130px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:hover { background: var(--bg2); }
.trow.head { cursor: default; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.trow.head:hover { background: none; }
.trow .n { text-align: right; }
.status { font-size: 12px; }
.status.mock { color: var(--win); font-weight: 600; } .status.live { color: var(--accent); }
@media (max-width: 720px) { .trow { grid-template-columns: minmax(0, 1fr) auto; } .trow .hide-s { display: none; } }
.tpage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.round { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.round > header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.round.empty { color: var(--muted); }
@media (max-width: 960px) { .tpage { grid-template-columns: 1fr; } }

/* C */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { padding: 10px 12px; }
.kpi b { display: block; font-size: 22px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { display: grid; grid-template-columns: 40px 1fr; gap: 2px 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: left; }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .nm { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.tile .bar { grid-column: 1 / -1; }
.tile .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.focus { padding: 14px; display: grid; gap: 12px; position: sticky; top: 12px; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
@media (max-width: 960px) { .cgrid { grid-template-columns: 1fr; } .focus { position: static; } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }

/* D */
.dside { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: end; }
@media (max-width: 720px) { .dside { grid-template-columns: 1fr; } }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
table.heat th { font-weight: 400; }
table.heat td button { width: 52px; height: 40px; border: 0; border-radius: 5px; display: grid; place-items: center; line-height: 1.1; font-size: 12px; }
table.heat td button small { color: var(--muted); font-size: 10px; }
table.heat td button.on { outline: 2px solid var(--fg); }

/* E */
.omni { display: grid; gap: 10px; max-width: 900px; margin: 0 auto; }
.omnibox { border: 2px solid var(--accent); border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); }
.omnibox input { border: 0; outline: 0; background: none; flex: 1 1 200px; min-width: 0; font-size: 17px; padding: 6px 4px; }
.vs { font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.answer { padding: 12px 14px; display: grid; gap: 8px; }

/* reference views */
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.shots figure { margin: 0; display: grid; gap: 6px; }
.shots img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
.shots .phone img { max-width: 260px; }
.shots figcaption { font-size: 13px; color: var(--muted); }
.find { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.find ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.prose { max-width: 70ch; }

/* notes drawer */
.notes { margin-bottom: 16px; }
.notes .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 8px; }
.notes ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; }

/* prototype switcher: deliberately not part of the designs */
.proto { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 4px; background: var(--bar-bg); color: var(--bar-fg); border-radius: 999px; padding: 5px; box-shadow: 0 6px 24px rgb(0 0 0 / .35); max-width: calc(100vw - 24px); }
.proto button { border: 0; background: none; color: inherit; border-radius: 999px; padding: 6px 11px; font-size: 13px; }
.proto button:hover { background: color-mix(in srgb, var(--bar-fg) 15%, transparent); }
.proto .cur { font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto .dots { display: flex; gap: 2px; }
.proto .dots button { padding: 6px 8px; font-family: var(--mono); font-size: 12px; opacity: .6; }
.proto .dots button.on { opacity: 1; background: color-mix(in srgb, var(--bar-fg) 22%, transparent); }
@media (max-width: 640px) { .proto .dots { display: none; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 49; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgb(0 0 0 / .25); max-width: calc(100vw - 32px); }
.toast button { border: 0; background: none; color: var(--bg); text-decoration: underline; font-weight: 600; }
textarea.export { width: 100%; min-width: 0; font-family: var(--mono); font-size: 12px; line-height: 1.4; background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre; overflow: auto; resize: vertical; }
@media (max-width: 1250px) { .cgrid.f { grid-template-columns: 1fr; } .cgrid.f .focus { position: static; } }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .match, .tile { transition: border-color .15s; } }
</style>

<script src="https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
const { html, render, useState, useMemo, useEffect, useRef } = htmPreact;

// ------------------------------------------------------------------ variants
const VARIANTS = [
  { id: "replay-bank", key: "R", name: "Replay Bank (reference)" },
  { id: "current", key: "0", name: "Today's view" },
  { id: "match-bank", key: "A", name: "Match Bank" },
  { id: "tournaments", key: "B", name: "Tournament Browser" },
  { id: "format", key: "C", name: "Format Overview" },
  { id: "matchup", key: "D", name: "Matchup Explorer" },
  { id: "search", key: "E", name: "Search first" },
  { id: "combined", key: "F", name: "Combined draft" },
];
const FORMAT_NAMES = {};
const CATS = ["Official", "Team", "Ladder", "Side", "Other"];

// one filter state that every variant reads and writes (round 2, Q2)
const S = {
  variant: VARIANTS.some((v) => v.id === location.hash.slice(1)) ? location.hash.slice(1) : "combined",
  fmt: 0, fmts: [0], tab: "matches", stab: "overview", sfmt: null, condA: [], condB: [], side: "any", player: null, tour: null, round: null, cats: [], y0: null, y1: null,
  toast: null, notes: false,
};
let D = null;
let toastTimer = null;
function norm(patch) {
  if ("fmt" in patch && !("fmts" in patch)) patch.fmts = [patch.fmt];
  if ("fmts" in patch && patch.fmts.length && !("fmt" in patch)) patch.fmt = patch.fmts[0];
  return patch;
}
function set(patch) { Object.assign(S, norm(patch)); draw(); }
function snapshot() { const { toast, notes, ...rest } = S; return JSON.parse(JSON.stringify(rest)); }
function withUndo(text, patch) {
  const before = snapshot();
  Object.assign(S, norm(patch));
  S.toast = { text, undo: before };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => set({ toast: null }), 9000);
  draw();
}
function go(variant, patch = {}) {
  Object.assign(S, norm(patch), { variant });
  try { history.replaceState(null, "", "#" + variant); } catch (e) { location.hash = variant; }
  window.scrollTo(0, 0);
  draw();
}
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v !== S.variant && VARIANTS.some((x) => x.id === v)) { S.variant = v; draw(); } });

// ------------------------------------------------------------------ helpers
const toId = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const pct = (a, b) => (b ? (100 * a) / b : 0);
const fmtPct = (x) => (x >= 10 ? x.toFixed(0) : x.toFixed(1)) + "%";
const nf = new Intl.NumberFormat("en");
const yearOfDay = (d) => (d ? new Date(d * 86400000).getUTCFullYear() : null);
const dateOfDay = (d) => (d ? new Date(d * 86400000).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }) : "");
const monthKey = (t) => { const d = new Date(t * 1000); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
const replayUrl = (rid) => "https://replay.pokemonshowdown.com/" + rid;
const analyzeUrl = (rid) => "https://fulllifegames.com/Tools/PSDashboard?replay=" + encodeURIComponent(rid);
const threadUrl = (tid) => "https://www.smogon.com/forums/threads/" + tid + "/";
const fmtShort = (i) => FORMAT_NAMES[D.formats[i]].replace("[Gen ", "G").replace("] ", " ");
const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// ------------------------------------------------------------------ data prep
function prep(bank, tj, icons) {
  const sp = bank.species, it = bank.items, ab = bank.abilities, te = bank.teras, mv = bank.moves;
  const teams = bank.teams.map((t) => t.map((p) => ({ name: sp[p[0]], item: p[1] >= 0 ? it[p[1]] : null, ability: p[2] >= 0 ? ab[p[2]] : null, tera: p[3] >= 0 ? te[p[3]] : null, moves: p[4].map((x) => mv[x]), lead: !!p[5] })));
  const teamSp = teams.map((t) => new Set(t.map((p) => p.name)));
  const teamMv = teams.map((t) => new Set(t.flatMap((p) => p.moves)));
  const teamIt = teams.map((t) => new Set(t.map((p) => p.item).filter(Boolean)));
  bank.formats.forEach((f, i) => { FORMAT_NAMES[f] = (bank.formatNames && bank.formatNames[i]) || f; });
  const tours = tj.tournaments;
  const threadInfo = {};
  tours.forEach((t, ti) => t.th.forEach((th) => { threadInfo[th[0]] = { tour: ti, round: th[1], d0: th[2] }; }));
  const alts = bank.alts;
  const games = bank.games.map((g, i) => ({ i, rid: g[0], fmt: g[1], t: g[2], m: g[3], sides: [{ alt: g[4], team: g[7], win: g[6] === 1 }, { alt: g[5], team: g[8], win: g[6] === 2 }] }));
  const players = new Map();
  const P = (key) => { let p = players.get(key); if (!p) { p = { key, alts: new Set(), matches: [], w: 0, l: 0 }; players.set(key, p); } return p; };
  const matches = bank.matches.map((m, i) => {
    const [tid, tour, a, b, w, d, gi] = m;
    const gs = gi.map((x) => games[x]);
    const mo = { i, tid, tour, a, b, w, d, games: gs, fmt: gs[0].fmt, fmts: [...new Set(gs.map((g) => g.fmt))], round: (threadInfo[tid] && threadInfo[tid].round) || "" };
    for (const g of gs) {
      const r = g.sides.map((s) => { const k = alts[s.alt]; if (k && (k === a || k === b)) return k; if (a && toId(s.alt) === toId(a)) return a; if (b && toId(s.alt) === toId(b)) return b; return null; });
      if (r[0] && !r[1]) r[1] = r[0] === a ? (b || g.sides[1].alt) : (a || g.sides[1].alt);
      if (r[1] && !r[0]) r[0] = r[1] === a ? (b || g.sides[0].alt) : (a || g.sides[0].alt);
      if (!r[0] && !r[1]) { r[0] = a || alts[g.sides[0].alt] || g.sides[0].alt; r[1] = b || alts[g.sides[1].alt] || g.sides[1].alt; }
      g.sides[0].p = r[0]; g.sides[1].p = r[1];
    }
    const keys = [...new Set(gs.flatMap((g) => g.sides.map((s) => s.p)))].slice(0, 2);
    const side = (k) => { const o = { p: k, alts: new Set(), teams: [], wins: 0 }; for (const g of gs) for (const s of g.sides) if (s.p === k) { o.alts.add(s.alt); if (s.team >= 0 && !o.teams.includes(s.team)) o.teams.push(s.team); if (s.win) o.wins++; } return o; };
    let L = side(keys[0]), R = side(keys[1] || "?");
    const wk = w && keys.find((k) => toId(k) === toId(w));
    // the thread's result is the Match result; the replays decide the Games; a disagreement is marked
    const gm = L.wins === R.wins ? null : L.wins > R.wins ? L : R;
    const win = wk ? (L.p === wk ? L : R) : gm;
    if (win === R) [L, R] = [R, L];
    mo.L = L; mo.R = R; mo.decided = !!win; mo.mismatch = !!(wk && gm && gm.p !== wk);
    for (const s of [L, R]) { const p = P(s.p); s.alts.forEach((x) => p.alts.add(x)); p.matches.push(mo); }
    if (mo.decided) { P(L.p).w++; P(R.p).l++; }
    return mo;
  });
  const speciesByFmt = bank.formats.map(() => new Map());
  const movesByFmt = bank.formats.map(() => new Map());
  const itemsByFmt = bank.formats.map(() => new Map());
  for (const g of games) for (const s of g.sides) if (s.team >= 0) {
    for (const p of teams[s.team]) {
      speciesByFmt[g.fmt].set(p.name, (speciesByFmt[g.fmt].get(p.name) || 0) + 1);
      for (const x of p.moves) movesByFmt[g.fmt].set(x, (movesByFmt[g.fmt].get(x) || 0) + 1);
      if (p.item) itemsByFmt[g.fmt].set(p.item, (itemsByFmt[g.fmt].get(p.item) || 0) + 1);
    }
  }
  const toursByFmt = bank.formats.map(() => new Map());
  const tourMatches = new Map();
  for (const m of matches) {
    for (const g of m.games) toursByFmt[g.fmt].set(m.tour, (toursByFmt[g.fmt].get(m.tour) || 0) + 1);
    if (!tourMatches.has(m.tour)) tourMatches.set(m.tour, []);
    tourMatches.get(m.tour).push(m);
  }
  const years = [...new Set(matches.map((m) => yearOfDay(m.d)))].filter(Boolean).sort();
  const threadCount = tours.reduce((a, t) => a + t.th.length, 0);
  return { formats: bank.formats, teams, teamSp, teamMv, teamIt, tours, threadInfo, games, matches, players, alts, icons, speciesByFmt, movesByFmt, itemsByFmt, toursByFmt, tourMatches, years, threadCount, liveFormats: tj.liveFormats };
}

// ------------------------------------------------------------------ query (shared by every variant)
const multi = () => S.variant === "combined";
const activeFmts = () => (multi() ? S.fmts : [S.fmt]);
const fmtList = () => { const f = activeFmts(); return f.length ? f : D.formats.map((_, i) => i); };
function merged(byFmt, list = fmtList()) {
  if (list.length === 1) return byFmt[list[0]];
  const m = new Map();
  for (const i of list) for (const [k, n] of byFmt[i]) m.set(k, (m.get(k) || 0) + n);
  return m;
}
function baseOk(m, o) {
  if (o.fs.length && !m.fmts.some((f) => o.fs.includes(f))) return false;
  if (!o.ignoreTour && S.tour != null && m.tour !== S.tour) return false;
  if (!o.ignoreTour && S.tour != null && S.round != null && m.round !== S.round) return false;
  if (S.cats.length && !S.cats.includes(D.tours[m.tour] && D.tours[m.tour].c)) return false;
  const y = yearOfDay(m.d);
  if (S.y0 && y < S.y0) return false;
  if (S.y1 && y > S.y1) return false;
  return true;
}
function sideOk(team, conds) {
  if (!conds.length) return true;
  if (team < 0) return conds.every((c) => c.neg);
  for (const c of conds) {
    const setOf = c.kind === "move" ? D.teamMv[team] : c.kind === "item" ? D.teamIt[team] : D.teamSp[team];
    const has = setOf.has(c.name);
    if (c.neg ? has : !has) return false;
  }
  return true;
}
function gameX(g, o) {
  const res = [];
  for (const xi of [0, 1]) {
    const x = g.sides[xi], y = g.sides[1 - xi];
    if (S.side === "win" && !x.win) continue;
    if (S.side === "lose" && !y.win) continue;
    if (!o.ignorePlayer && S.player && x.p !== S.player) continue;
    if (!o.ignoreConds && !sideOk(x.team, S.condA)) continue;
    if (!o.ignoreConds && !sideOk(y.team, S.condB)) continue;
    res.push(xi);
  }
  return res;
}
let qCache = new Map();
function query(o = {}) {
  const fs = activeFmts();
  const key = JSON.stringify([fs, S.condA, S.condB, S.side, S.player, S.tour, S.round, S.cats, S.y0, S.y1, o]);
  if (qCache.has(key)) return qCache.get(key);
  // all Formats together are too large to load at once: something has to narrow the search
  if (multi() && !fs.length && S.tour == null && !S.player) return { matches: [], sides: [], games: [], needsNarrowing: true };
  o = { ...o, fs };
  const constrained = (!o.ignorePlayer && S.player) || (!o.ignoreConds && S.condA.length) || S.side !== "any";
  const ms = [], sides = [], games = [];
  for (const m of D.matches) {
    if (!baseOk(m, o)) continue;
    let any = false;
    for (const g of m.games) {
      if (fs.length && !fs.includes(g.fmt)) continue; // the Format belongs to the Game: a Match can span Formats
      const xs = gameX(g, o);
      if (!xs.length) continue;
      any = true; games.push(g);
      const take = constrained ? xs : [0, 1];
      for (const xi of take) sides.push({ team: g.sides[xi].team, win: g.sides[xi].win, alt: g.sides[xi].alt, p: g.sides[xi].p, g, m, opp: g.sides[1 - xi].team });
    }
    if (any) ms.push(m);
  }
  ms.sort((a, b) => b.d - a.d || b.i - a.i);
  const r = { matches: ms, sides, games };
  if (qCache.size > 40) qCache = new Map();
  qCache.set(key, r);
  return r;
}
function hlSet() {
  const m = new Map();
  for (const c of S.condB) if (!c.neg && (!c.kind || c.kind === "mon")) m.set(c.name, "b");
  for (const c of S.condA) if (!c.neg && (!c.kind || c.kind === "mon")) m.set(c.name, "a");
  return m;
}

// ------------------------------------------------------------------ stats
function count(sides, fn) {
  const c = new Map(); let total = 0;
  for (const s of sides) {
    if (s.team < 0) continue;
    total++;
    for (const key of new Set(fn(D.teams[s.team], s))) { let o = c.get(key); if (!o) { o = { key, n: 0, w: 0 }; c.set(key, o); } o.n++; if (s.win) o.w++; }
  }
  return { total, rows: [...c.values()].sort((a, b) => b.n - a.n || b.w - a.w) };
}
const monStats = (sides) => count(sides, (t) => t.map((p) => p.name));
function coreStats(sides, k) {
  return count(sides, (t) => { const n = t.map((p) => p.name).sort(); const out = []; for (let i = 0; i < n.length; i++) for (let j = i + 1; j < n.length; j++) { if (k === 2) out.push(n[i] + "|" + n[j]); else for (let l = j + 1; l < n.length; l++) out.push(n[i] + "|" + n[j] + "|" + n[l]); } return out; });
}
function monDetail(name, sides) {
  const mine = sides.filter((s) => s.team >= 0 && D.teamSp[s.team].has(name));
  const pick = (fn) => count(mine, (t) => { const p = t.find((x) => x.name === name); return p ? fn(p, t) : []; });
  const opp = count(mine.filter((s) => s.opp >= 0).map((s) => ({ team: s.opp, win: s.win })), (t) => t.map((p) => p.name));
  return {
    n: mine.length, w: mine.filter((s) => s.win).length,
    items: pick((p) => (p.item ? [p.item] : [])), teras: pick((p) => (p.tera ? [p.tera] : [])),
    moves: pick((p) => p.moves), abilities: pick((p) => (p.ability ? [p.ability] : [])),
    mates: pick((p, t) => t.filter((x) => x.name !== name).map((x) => x.name)),
    opp,
  };
}

// autocomplete input

    })}</div>` : ""}

}

// stats panel (used by A, B and E)
function StatsPanel({ sides }) {
  const [sub, setSub] = useState("mons");
  const [openRow, setOpenRow] = useState(null);
  const [limit, setLimit] = useState(30);
  const ms = useMemo(() => monStats(sides), [sides]);
  const pick = (name) => withUndo("Showing Matches with " + name, { condA: [...S.condA.filter((c) => c.name !== name), { name, kind: "mon", neg: false }] });
  const wr = (o) => { const x = pct(o.w, o.n); return html`<span class=${"wr " + (o.n >= 5 && x >= 55 ? "good" : o.n >= 5 && x <= 45 ? "bad" : "")}>${fmtPct(x)}</span>`; };
  const table = (rows, total, render1, keyLabel) => html`<div class="scroll-x"><table class="st"><thead><tr><th>#</th><th>${keyLabel}</th><th>Usage</th><th class="num">Teams</th><th class="num">Win %</th></tr></thead><tbody>
    ${rows.slice(0, limit).map((o, k) => html`<tr><td class="muted">${k + 1}</td><td>${render1(o)}</td><td><div class="bar" title=${fmtPct(pct(o.n, total))}><i style=${"width:" + pct(o.n, rows[0].n) + "%"}></i></div> <span class="small muted">${fmtPct(pct(o.n, total))}</span></td><td class="num">${nf.format(o.n)}</td><td class="num">${wr(o)}</td></tr>`)}
  </tbody></table></div>${rows.length > limit ? html`<button class="btn" style="margin-top:8px" onClick=${() => setLimit(limit + 40)}>Show more</button>` : ""}`;
  let body;
  if (sub === "mons") {
    body = html`<div class="scroll-x"><table class="st"><thead><tr><th>#</th><th>Pokémon</th><th>Usage</th><th class="num">Teams</th><th class="num">Win %</th><th></th></tr></thead><tbody>
      ${ms.rows.slice(0, limit).map((o, k) => html`<tr><td class="muted">${k + 1}</td>
        <td><span style="display:inline-flex;align-items:center;gap:6px"><${Icon} name=${o.key} /><button class="monname" title="Show the Matches with this Pokémon" onClick=${() => pick(o.key)}>${o.key}</button></span></td>
        <td><div class="bar"><i style=${"width:" + pct(o.n, ms.rows[0].n) + "%"}></i></div> <span class="small muted">${fmtPct(pct(o.n, ms.total))}</span></td>
        <td class="num">${nf.format(o.n)}</td><td class="num">${wr(o)}</td>
        <td><button class="btn" aria-expanded=${openRow === o.key} onClick=${() => setOpenRow(openRow === o.key ? null : o.key)}>${openRow === o.key ? "Less" : "Sets"}</button></td></tr>
        ${openRow === o.key ? html`<tr class="detail"><td></td><td colspan="5"><${MonDetailGrid} name=${o.key} sides=${sides} /></td></tr>` : ""}`)}
    </tbody></table></div>${ms.rows.length > limit ? html`<button class="btn" style="margin-top:8px" onClick=${() => setLimit(limit + 40)}>Show more</button>` : ""}`;
  } else if (sub === "cores2" || sub === "cores3") {
    const cs = coreStats(sides, sub === "cores2" ? 2 : 3);
    body = table(cs.rows, cs.total, (o) => html`<span style="display:inline-flex">${o.key.split("|").map((n) => html`<${Icon} name=${n} />`)}</span>`, "Core");
  } else {
    const fn = { leads: (t) => t.filter((p) => p.lead).map((p) => p.name), items: (t) => t.map((p) => p.item).filter(Boolean), moves: (t) => t.flatMap((p) => p.moves), tera: (t) => t.map((p) => p.tera).filter(Boolean) }[sub];
    const cs = count(sides, fn);
    body = table(cs.rows, cs.total, (o) => (sub === "leads" ? html`<span style="display:inline-flex;align-items:center;gap:6px"><${Icon} name=${o.key} />${o.key}</span>` : o.key), { leads: "Lead", items: "Item", moves: "Move", tera: "Tera type" }[sub]);
  }
  return html`<div style="display:grid;gap:10px">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
      <div class="seg">${[["mons", "Pokémon"], ["cores2", "Pairs"], ["cores3", "Trios"], ["leads", "Leads"], ["items", "Items"], ["moves", "Moves"], ["tera", "Tera"]].map(([k, l]) => html`<button class=${sub === k ? "on" : ""} onClick=${() => { setSub(k); setLimit(30); }}>${l}</button>`)}</div>
      <span class="muted small">Over ${nf.format(ms.total)} Teams in the current search · win % from the Games</span>
    </div>${body}</div>`;
}
function MonDetailGrid({ name, sides }) {
  const d = useMemo(() => monDetail(name, sides), [name, sides]);
  const list = (title, c, icons) => html`<div class="kv"><div class="label">${title}</div>${c.rows.slice(0, 6).map((o) => html`<div><span style="display:inline-flex;align-items:center;gap:4px">${icons ? html`<${Icon} name=${o.key} />` : ""}${o.key}</span><span class="muted">${fmtPct(pct(o.n, c.total))}</span></div>`)}${!c.rows.length ? html`<div class="muted">none seen</div>` : ""}</div>`;
  return html`<div class="detailgrid">${list("Items", d.items)}${list("Tera", d.teras)}${list("Moves", d.moves)}${list("Teammates", d.mates, true)}</div>`;
}
function TeamsPanel({ sides, hl }) {
  const [openT, setOpenT] = useState(null);
  const [n, setN] = useState(25);
  const rows = useMemo(() => {
    const g = new Map();
    for (const s of sides) { if (s.team < 0) continue; let o = g.get(s.team); if (!o) { o = { team: s.team, n: 0, w: 0, alts: new Set(), d: 0 }; g.set(s.team, o); } o.n++; if (s.win) o.w++; o.alts.add(s.alt); o.d = Math.max(o.d, s.m.d); }
    return [...g.values()].sort((a, b) => b.n - a.n || b.d - a.d);
  }, [sides]);
  return html`<div class="mlist">${rows.slice(0, n).map((o) => html`<div class="match">
    <div class="mrow" style="grid-template-columns:minmax(0,1fr) auto" onClick=${() => setOpenT(openT === o.team ? null : o.team)}>
      <div class="side"><${Team} team=${o.team} hl=${hl} /><div class="who muted">${[...o.alts].slice(0, 4).join(", ")}${o.alts.size > 4 ? " +" + (o.alts.size - 4) : ""}</div></div>
      <div class="small" style="text-align:right">${o.n} ${o.n === 1 ? "Game" : "Games"}<br /><span class=${pct(o.w, o.n) >= 50 ? "wr good" : "wr"}>${o.w}–${o.n - o.w}</span></div>
    </div>
    ${openT === o.team ? html`<div class="games"><pre style="margin:0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap">${exportText(o.team)}</pre><div><button class="btn" onClick=${() => copy(exportText(o.team))}>Copy as Showdown text</button></div></div>` : ""}
  </div>`)}
  ${n < rows.length ? html`<button class="btn" onClick=${() => setN(n + 25)}>Show 25 more (${nf.format(rows.length - n)} left)</button>` : ""}</div>`;
}

// ------------------------------------------------------------------ variant B: Tournament Browser
function VariantB() {
  return S.tour != null ? html`<${TournamentPage} />` : html`<${TournamentList} />`;
}
function TournamentList() {
  const [q, setQ] = useState("");
  const [only, setOnly] = useState("any");
  const [n, setN] = useState(50);
  const rows = useMemo(() => {
    const out = [];
    D.tours.forEach((t, ti) => {
      if (q && !toId(t.n).includes(toId(q))) return;
      if (S.cats.length && !S.cats.includes(t.c)) return;
      const live = t.th.some((x) => x[5]);
      const mock = D.tourMatches.has(ti);
      if (only === "mock" && !mock) return;
      if (only === "live" && !live) return;
      const d0 = Math.max(...t.th.map((x) => x[2] || 0));
      const y = yearOfDay(d0);
      if (S.y0 && y < S.y0) return;
      if (S.y1 && y > S.y1) return;
      out.push({ t, ti, d0, live, mock, matches: t.th.reduce((a, x) => a + x[3], 0), rep: t.th.reduce((a, x) => a + x[4], 0) });
    });
    return out.sort((a, b) => b.d0 - a.d0);
  }, [q, only, S.cats, S.y0, S.y1]);
  useEffect(() => setN(50), [rows]);
  return html`<${Notes} />
  <div style="display:grid;gap:14px">
    <div class="rhead" style="margin:0"><h2>Smogon Tournaments</h2><span class="muted">${nf.format(rows.length)} of ${nf.format(D.tours.length)} Tournaments from ${nf.format(D.threadCount)} threads · newest first</span></div>
    <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:end" class="bfilters">
      <div class="field"><label class="label" for="b-q">Search</label><input id="b-q" class="text" placeholder="e.g. Seasonal, SPL, Smogon Tour, PTPL" value=${q} onInput=${(e) => setQ(e.target.value)} /></div>
      <div class="field"><label class="label" for="b-only">Show</label><select id="b-only" value=${only} onChange=${(e) => setOnly(e.target.value)}><option value="any">All Tournaments</option><option value="live">With Teams online today</option><option value="mock">With Teams in this mockup (12 Formats)</option></select></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:end"><${CatChips} /><${YearRange} /></div>
    <div class="tlist">
      <div class="trow head"><span>Tournament</span><span class="n hide-s">Year</span><span class="n hide-s">Rounds</span><span class="n hide-s">Matches</span><span>Teams</span></div>
      ${rows.slice(0, n).map((o) => html`<div class="trow" role="button" tabindex="0" onClick=${() => set({ tour: o.ti, round: null, fmt: o.mock ? D.tourMatches.get(o.ti)[0].fmt : S.fmt })} onKeyDown=${(e) => e.key === "Enter" && set({ tour: o.ti, round: null })}>
        <span style="min-width:0"><b style="overflow-wrap:anywhere">${o.t.n}</b> <span class=${"pill cat-" + o.t.c}>${o.t.c}</span>${o.t.f.length ? html` <span class="muted small">${o.t.f.slice(0, 3).join(", ")}</span>` : ""}</span>
        <span class="n hide-s muted">${yearOfDay(o.d0) || ""}</span>
        <span class="n hide-s">${o.t.th.length}</span>
        <span class="n hide-s">${nf.format(o.matches)}</span>
        <span class=${"status " + (o.mock ? "mock" : o.live ? "live" : "muted")}>${o.mock ? "In mockup" : o.live ? "Online today" : o.rep ? nf.format(o.rep) + " with replays" : "No replays"}</span>
      </div>`)}
    </div>
    ${n < rows.length ? html`<button class="btn" onClick=${() => setN(n + 50)}>Show 50 more (${nf.format(rows.length - n)} left)</button>` : ""}
    <p class="muted small prose">Grouping threads into Tournaments, the Rounds and the categories are guessed from thread names for this mockup. "In mockup" means its Teams in one of the 12 loaded Formats are here; "Online today" means the live TournamentTeams files have Teams for it. After the collector's first full run, every Tournament with replays has Teams.</p>
  </div>`;
}
function TournamentPage() {
  const t = D.tours[S.tour];
  const all = D.tourMatches.get(S.tour) || [];
  const fmts = [...new Set(all.flatMap((m) => m.fmts))];
  const r = query();
  const hl = hlSet();
  const byThread = new Map();
  for (const m of r.matches) { if (!byThread.has(m.tid)) byThread.set(m.tid, []); byThread.get(m.tid).push(m); }
  const recs = new Map();
  for (const m of r.matches) for (const [s, won] of [[m.L, m.decided], [m.R, false]]) { let o = recs.get(s.p); if (!o) { o = { p: s.p, w: 0, l: 0 }; recs.set(s.p, o); } if (m.decided) won ? o.w++ : o.l++; }
  const top = [...recs.values()].sort((a, b) => b.w - a.w || a.l - b.l).slice(0, 10);
  const ms = monStats(r.sides);
  const d0 = Math.min(...t.th.map((x) => x[2] || 1e9)), d1 = Math.max(...t.th.map((x) => x[2] || 0));
  const rounds = S.round != null ? t.th.filter((x) => x[1] === S.round) : t.th;
  return html`<${Notes} />
  <div style="display:grid;gap:6px;margin-bottom:12px">
    <div><button class="btn link" onClick=${() => set({ tour: null, round: null })}>← All Tournaments</button></div>
    <div class="rhead" style="margin:0"><h2>${t.n}</h2><span class=${"pill cat-" + t.c}>${t.c}</span><span class="muted">${dateOfDay(d0)} – ${dateOfDay(d1)} · ${t.th.length} threads · ${nf.format(t.th.reduce((a, x) => a + x[3], 0))} Matches</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      ${fmts.length > 1 ? html`<div class="seg">${fmts.map((f) => html`<button class=${S.fmt === f ? "on" : ""} onClick=${() => set({ fmt: f })}>${FORMAT_NAMES[D.formats[f]]}</button>`)}</div>` : html`<span class="pill">${FORMAT_NAMES[D.formats[S.fmt]]}</span>`}
      ${t.f.length ? html`<span class="muted small">Formats played: ${t.f.join(", ")}${t.f.length > fmts.length ? " (only 12 Formats are in the mockup)" : ""}</span>` : ""}
      <button class="btn" onClick=${() => go("match-bank", { tour: null, round: null })}>Widen to all ${FORMAT_NAMES[D.formats[S.fmt]]} →</button>
      <button class="btn" onClick=${() => go("match-bank")}>Open in Match Bank →</button>
    </div>
  </div>
  <div class="tpage">

function LineChart({ points }) {
  if (points.length < 2) return html`<div class="muted small">Not enough months with Games for a curve.</div>`;
  const W = 320, H = 110, pl = 30, pb = 18, pt = 8;
  const max = Math.max(...points.map((p) => p.v), 1);
  const x = (i) => pl + (i * (W - pl - 6)) / (points.length - 1);
  const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = d + " L" + x(points.length - 1).toFixed(1) + " " + (H - pb) + " L" + pl + " " + (H - pb) + " Z";
  const last = points[points.length - 1];
  return html`<svg class="chart" viewBox=${"0 0 " + W + " " + H} width="100%" role="img" aria-label="Usage per month">
    <line x1=${pl} x2=${W - 6} y1=${y(max)} y2=${y(max)} stroke="var(--line)" stroke-dasharray="3 3" />
    <line x1=${pl} x2=${W - 6} y1=${H - pb} y2=${H - pb} stroke="var(--line)" />
    <text x=${pl - 4} y=${y(max) + 3} text-anchor="end">${fmtPct(max)}</text>
    <text x=${pl - 4} y=${H - pb + 3} text-anchor="end">0</text>
    <path d=${area} fill="var(--accent)" fill-opacity="0.12" />
    <path d=${d} fill="none" stroke="var(--accent)" stroke-width="2" />
    <circle cx=${x(points.length - 1)} cy=${y(last.v)} r="3.5" fill="var(--accent)" />
    <text x=${pl} y=${H - 4}>${points[0].k}</text><text x=${W - 6} y=${H - 4} text-anchor="end">${last.k}</text>
  </svg>`;
}

function heatGrid(games, sides) {
  const top = monStats(sides).rows.slice(0, 12).map((o) => o.key);
  const idx = new Map(top.map((n, i) => [n, i]));
  const M = top.map(() => top.map(() => ({ n: 0, w: 0 })));
  for (const g of games) for (const xi of [0, 1]) {
    const x = g.sides[xi], y = g.sides[1 - xi];
    if (x.team < 0 || y.team < 0) continue;
    const xs = D.teams[x.team].map((p) => idx.get(p.name)).filter((v) => v != null);
    const ys = D.teams[y.team].map((p) => idx.get(p.name)).filter((v) => v != null);
    for (const a of xs) for (const b of ys) { M[a][b].n++; if (x.win) M[a][b].w++; }
  }
  return { top, M };
}

          <div class="sub"><span>${fmtPct(pct(o.n, ms.total))} of Teams</span><span class=${pct(o.w, o.n) >= 55 && o.n >= 5 ? "wr good" : pct(o.w, o.n) <= 45 && o.n >= 5 ? "wr bad" : ""}>${fmtPct(pct(o.w, o.n))} won</span></div></button>`)}</div>
      </section>
      <aside class="card focus"><${MonFocus} name=${f} sides=${sides} /></aside>
    </div>
  </div>`;
}
function MatchupsF({ fmt }) {
  const base = query({ ignoreConds: true, ignorePlayer: true });
  const grid = useMemo(() => {
    const games = fmt == null ? base.games : base.games.filter((g) => g.fmt === fmt);
    const sides = fmt == null ? base.sides : base.sides.filter((s) => s.g.fmt === fmt);
    return heatGrid(games, sides);
  }, [base, fmt]);
  const pick = (rn, cn) => withUndo("Showing Matches of " + rn + " teams against " + cn + " teams", { tab: "matches", side: "any", condA: [{ name: rn, kind: "mon", neg: false }], condB: [{ name: cn, kind: "mon", neg: false }] });
  if (!grid.top.length) return html`<div class="note">No Teams in this search.</div>`;
  return html`<section style="display:grid;gap:8px">
    <span class="muted small">The 12 most used Pokémon against each other: the row Pokémon's team against the column Pokémon's team, win % of the row side with the number of Games below. Pale cells have few Games. A cell opens its Matches. The Pokémon filters are ignored here.</span>
    <div class="scroll-x"><table class="heat"><thead><tr><th></th>${grid.top.map((n) => html`<th title=${n}><${Icon} name=${n} /></th>`)}</tr></thead><tbody>
      ${grid.top.map((rn, i) => html`<tr><th title=${rn}><${Icon} name=${rn} /></th>${grid.top.map((cn, j) => { const o = grid.M[i][j]; return html`<td><button style=${heatCell(o)} title=${rn + " vs " + cn + ": " + o.n + " Games"} onClick=${() => pick(rn, cn)}>${o.n ? fmtPct(pct(o.w, o.n)) : "–"}<small>${o.n || ""}</small></button></td>`; })}</tr>`)}
    </tbody></table></div></section>`;
}

// Tournaments tab: the Tournaments of the current search, or the whole index
function ToursTab({ r }) {
  const [q, setQ] = useState("");
  const [all, setAll] = useState(false);
  const [n, setN] = useState(40);
  const indexMode = all || !!r.needsNarrowing;
  const rows = useMemo(() => {
    const out = [];
    if (!indexMode) {
      const g = new Map();
      for (const m of r.matches) { let o = g.get(m.tour); if (!o) { o = { ti: m.tour, matches: 0, d: 0, fm: new Set() }; g.set(m.tour, o); } o.matches++; o.d = Math.max(o.d, m.d); for (const f of m.fmts) if (!S.fmts.length || S.fmts.includes(f)) o.fm.add(f); }
      for (const o of g.values()) { const t = D.tours[o.ti]; if (!t || (q && !match(q, t.n))) continue; out.push({ ...o, t, has: true }); }
    } else {
      D.tours.forEach((t, ti) => {
        if (q && !match(q, t.n)) return;
        if (S.cats.length && !S.cats.includes(t.c)) return;
        const d = Math.max(...t.th.map((x) => x[2] || 0));
        const y = yearOfDay(d);
        if (S.y0 && y < S.y0) return;
        if (S.y1 && y > S.y1) return;
        out.push({ ti, t, d, matches: t.th.reduce((a, x) => a + x[3], 0), rep: t.th.reduce((a, x) => a + x[4], 0), has: D.tourMatches.has(ti), fm: new Set(tourFormats(ti).map((x) => x[0])) });
      });
    }
    return out.sort((a, b) => b.d - a.d);
  }, [r, q, indexMode, S.cats, S.y0, S.y1]);
  useEffect(() => setN(40), [rows]);
  return html`<div style="display:grid;gap:12px">
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center">
      <input class="text" style="flex:1 1 220px;width:auto" aria-label="Search Tournaments" placeholder="Search these Tournaments" value=${q} onInput=${(e) => setQ(e.target.value)} />
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked=${indexMode} disabled=${!!r.needsNarrowing} onChange=${(e) => setAll(e.target.checked)} /> All ${nf.format(D.tours.length)} Tournaments, also without Teams</label>
    </div>
    <span class="muted small">${indexMode ? nf.format(rows.length) + " Tournaments from the index (" + nf.format(D.threadCount) + " threads); only category and years filter here." : nf.format(rows.length) + " Tournaments have Matches in the current search."} Newest first.</span>
    <div class="tlist">
      <div class="trow head"><span>Tournament</span><span class="n hide-s">Year</span><span class="n hide-s">Rounds</span><span class="n hide-s">${indexMode ? "Matches" : "In search"}</span><span>Formats</span></div>
      ${rows.slice(0, n).map((o) => html`<div class="trow" role="button" tabindex="0" onClick=${() => pickTour(o.ti)} onKeyDown=${(e) => e.key === "Enter" && pickTour(o.ti)}>
        <span style="min-width:0"><b style="overflow-wrap:anywhere">${o.t.n}</b> <span class=${"pill cat-" + o.t.c}>${o.t.c}</span></span>
        <span class="n hide-s muted">${yearOfDay(o.d) || ""}</span>
        <span class="n hide-s">${o.t.th.length}</span>
        <span class="n hide-s">${nf.format(o.matches)}</span>
        <span class=${"status " + (o.has ? "" : "muted")}>${o.fm.size ? [...o.fm].slice(0, 2).map(fmtShort).join(", ") + (o.fm.size > 2 ? " +" + (o.fm.size - 2) : "") : o.rep ? "not in mockup" : "no replays"}</span>
      </div>`)}
    </div>
    ${n < rows.length ? html`<div><button class="btn" onClick=${() => setN(n + 40)}>Show 40 more (${nf.format(rows.length - n)} left)</button></div>` : ""}
  </div>`;
}

// ------------------------------------------------------------------ shell
function stateUrl() {
  const p = [];
  if (multi()) { if (S.fmts.length) p.push("format=" + S.fmts.map((i) => D.formats[i]).join(",")); if (S.tab !== "matches") p.push("view=" + S.tab + (S.tab === "stats" && S.stab !== "overview" ? "." + S.stab : "")); }
  else p.push("format=" + D.formats[S.fmt]);
  if (S.condA.length) p.push("team=" + S.condA.map((c) => (c.neg ? "-" : "") + (c.kind && c.kind !== "mon" ? c.kind + ":" : "") + slug(c.name)).join(","));
  if (S.side !== "any") p.push("side=" + S.side);
  if (S.condB.length) p.push("vs=" + S.condB.map((c) => (c.neg ? "-" : "") + (c.kind && c.kind !== "mon" ? c.kind + ":" : "") + slug(c.name)).join(","));
  if (S.player) p.push("player=" + slug(S.player));
  if (S.tour != null) p.push("tour=" + slug(D.tours[S.tour].n));
  if (S.round != null) p.push("round=" + slug(S.round));
  if (S.cats.length) p.push("cat=" + S.cats.join(",").toLowerCase());
  if (S.y0) p.push("from=" + S.y0);
  if (S.y1) p.push("to=" + S.y1);
  return "#/tournaments?" + p.join("&");
}
function Proto() {
  const i = VARIANTS.findIndex((v) => v.id === S.variant);
  const v = VARIANTS[i];
  const step = (d) => go(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].id);
  return html`<nav class="proto" aria-label="Prototype variant switcher">
    <button onClick=${() => step(-1)} aria-label="Previous variant">←</button>
    <span class="dots">${VARIANTS.map((x) => html`<button class=${x.id === S.variant ? "on" : ""} title=${x.name} onClick=${() => go(x.id)}>${x.key}</button>`)}</span>
    <span class="cur">${v.key} · ${v.name}</span>
    <button onClick=${() => step(1)} aria-label="Next variant">→</button>
  </nav>`;
}
function App() {
  if (!D) return html`<div class="loading">Loading the tournament data for the mockups…</div>`;
  const V = { "replay-bank": VariantRB, current: VariantNow, "match-bank": VariantA, tournaments: VariantB, format: VariantC, matchup: VariantD, search: VariantE, combined: VariantF }[S.variant];
  const showState = !["replay-bank", "current"].includes(S.variant);
  return html`
    <header class="nav"><div class="wrap"><span class="brand">Showdown Companion</span><span class="links"><span>Replay Scouter</span><span class="on">Tournament Teams</span><span>Smogon Team Dump</span><span>Analyze Replays</span></span></div></header>
    ${showState ? html`<div class="state"><div class="wrap"><span class="label">Shared filter state</span><span class="grow"><code>${stateUrl()}</code></span><span class="muted">Kept when you switch mockups. Real data: live TournamentTeams files + TournamentParser matches.</span></div></div>` : ""}
    <main class="wrap"><${V} key=${S.variant} /></main>
    ${S.toast ? html`<div class="toast" role="status"><span>${S.toast.text}</span><button onClick=${() => { const u = S.toast.undo; Object.assign(S, u, { toast: null }); draw(); }}>Undo</button></div>` : ""}
    <${Proto} />`;
}
function draw() { render(html`<${App} />`, document.getElementById("app")); }

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const i = VARIANTS.findIndex((v) => v.id === S.variant);
  go(VARIANTS[(i + (e.key === "ArrowRight" ? 1 : -1) + VARIANTS.length) % VARIANTS.length].id);
});

draw();
Promise.all(["data/bank.json", "data/tournaments.json", "data/icons.json"].map((u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + " answered " + r.status); return r.json(); })))
  .then(([bank, tj, icons]) => { D = prep(bank, tj, icons); draw(); })
  .catch((e) => { document.getElementById("app").innerHTML = '<div class="loading">The mockup data did not load (' + String(e.message).replace(/[<>&]/g, "") + "). Reload the page to try again.</div>"; });
</script>
